services:
  - type: web
    name: synapse-study-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-preview-12-2025
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
